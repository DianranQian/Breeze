[workspace]
resolver = "3"
members = [
    "crates/scene_doc",
    "crates/savegame",
    "crates/runtime_protocol",
    "crates/breeze_debug_adapter",
    "crates/bsn_bridge",
    "crates/editor_core",
    "crates/editor_ui",
    "crates/editor_app",
    "crates/gui_probe",
    "tools/icon_bake",
    # 最小真实运行时样例：给「运行项目」的声明式运行目标提供一个
    # 能真跑、能停止、能被断言的可执行对象。它不是 Bevy 游戏，
    # 也**不**是示例项目（示例绝不进 workspace）。
    "tools/miniruntime",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = ""

# ---------------------------------------------------------------------------
# 依赖版本全部经过 crates.io 实际查询核实（2026-10 环境快照）：
#   bevy                 0.20.0   当前最新稳定版
#   bevy_egui            0.43.1   依赖 bevy ^0.20.0 与 egui ^0.36  → 与 Bevy 0.20 匹配
#   egui_dock            0.21.1   依赖 egui ^0.36               → 与 bevy_egui 的 egui 对齐
#   egui                 0.36     （注意：crates.io 上 egui 最新为 0.37，不可使用，
#                                  否则与 bevy_egui/egui_dock 的 egui 0.36 产生双版本冲突）
#   bevy-inspector-egui  0.37.0   ✗ 依赖 bevy ^0.19.0 + egui ^0.34，与 Bevy 0.20 不兼容，
#                                  因此本项目自行实现 Inspector，不引入该依赖。
# ---------------------------------------------------------------------------

[workspace.dependencies]
# `wav` / `vorbis` 必须显式打开：Bevy 0.20 的 `audio` 特性只带播放器，
# **不带任何解码器**。没有解码器时 `AudioSource` 会在音频线程里 panic
# （`UnrecognizedFormat`），实测表现为"点一下试听，编辑器直接崩"。
# 只开这两种格式，编辑器里也就只接受这两种（见 `audio_preview::可试听`）：
# 宁可明确拒绝一个没编进来的格式，也不要为它崩掉整个进程。
#
# `complex_script_segmentation` 必须打开：它把 `bevy_text` 的
# `parley/complex-scripts` 特性打开，让 parley 用
# `icu_segmenter::LineSegmenter::new_dictionary`（带中日文词典）而不是
# `new_for_non_complex_scripts`（不带任何复杂文字词典）。不打开时，
# **每一次**中文/日文文本重排都会吐出
# `ICU4X data error: No segmentation model for complex script: Chinese/Japanese`，
# 而且中文长句失去按词断行的能力。
#
# 这行警告还特别难缠：`icu_provider` 没启用自己的 `logging` 特性，
# 于是它的 `log::warn!` 实际被替换成了 `std::eprintln!`
# （见 `icu_provider` 的 `pub use std::eprintln as warn`），
# 因此它没有时间戳、没有级别，Bevy 的 `RUST_LOG` 过滤器和 tracing 层都拦不住。
# 唯一正当的修法就是让词典真的在（即这个特性），不是去过滤日志。
# 回归测试见 `crates/editor_app/tests/中文分段不告警.rs`。
bevy = { version = "0.20.0", default-features = true, features = [
    "wav",
    "vorbis",
    "complex_script_segmentation",
] }
bevy_egui = "0.43.1"
# `serde` 特性用于把颜色主题持久化成 RON（Color32 的序列化实现）。
# 它与 egui_dock 的 `serde` 特性所启用的是同一个特性，不会引入第二个 egui 版本。
egui = { version = "0.36", features = ["serde"] }
# `serde` 特性用于把停靠布局持久化到磁盘（窗口布局恢复）。
# 它只额外启用 `egui/serde`，不改变 egui 版本，因此不会影响兼容性。
egui_dock = { version = "0.21.1", features = ["serde"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
ron = "0.12.2"
uuid = { version = "1.28.0", features = ["v4", "v5", "serde"] }
thiserror = "2.0"
anyhow = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
smallvec = "1.13"
notify = "8.2.0"
rfd = "0.17.2"
bitflags = "2.0"

# 读取图片真实像素尺寸（从资源创建精灵时填入正确的视口包围盒）。
# 只启用解码所需的最小特性，避免拖入一堆用不到的编解码器，
# 这些特性与 Bevy 自己启用的 image 特性会做并集，不冲突。
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
] }

# 字体预览要读**真实字体文件**：家族名与字形数从字体表里取，
# 缺字检查要能回答"这个字体有没有这个字"。ttf-parser 是纯解析库
# （不渲染、不分配图集），版本已在 Bevy 的依赖图里（0.25.1），
# 因此不会引入第二份字体解析栈。
ttf-parser = "0.25.1"

scene_doc = { path = "crates/scene_doc" }
savegame = { path = "crates/savegame" }
runtime_protocol = { path = "crates/runtime_protocol" }
breeze_debug_adapter = { path = "crates/breeze_debug_adapter" }
bsn_bridge = { path = "crates/bsn_bridge" }
editor_core = { path = "crates/editor_core" }
editor_ui = { path = "crates/editor_ui" }

# ---------------------------------------------------------------------------
# 开发期编译优化：第三方依赖（Bevy）在 dev 模式下也用 opt-level = 2。
# 这是 Bevy 官方推荐的配置：编辑-运行循环的迭代速度显著提升。
# ---------------------------------------------------------------------------
[profile.dev]
debug = 1
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# 测试也要能跑得动 Bevy 本体：测试环境复用同一份依赖优化。
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 2
