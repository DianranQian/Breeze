[package]
name = "editor_app"
description = "Bevy Studio 编辑器应用入口：窗口、Bevy 插件装配、视口渲染、运行时宿主。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bevy-studio"
path = "src/main.rs"

[lib]
name = "editor_app"
path = "src/lib.rs"

[dependencies]
scene_doc.workspace = true
runtime_protocol.workspace = true
bsn_bridge.workspace = true
editor_core.workspace = true
editor_ui.workspace = true

bevy.workspace = true
# 2D 物理引擎选型记录（见 physics_runtime.rs 的模块文档）：
# - Avian 2D 0.7 依赖 Bevy ^0.19，不支持本项目使用的 Bevy 0.20，排除；
# - bevy_rapier2d 0.37 依赖 Bevy ^0.20，Apache-2.0，集成由官方维护 —— 采用。
rapier2d = { version = "0.36", default-features = false, features = ["dim2", "f32", "std", "block-solver", "simd8"] }
bevy_egui.workspace = true
egui.workspace = true
serde.workspace = true
# 采集证据（GUI 自动验收的 JSON）序列化。
serde_json.workspace = true
# 编辑器配置（窗口布局）与场景文件用同一套 RON 序列化，
# 但存在完全不同的位置，两者互不干扰。
ron.workspace = true
uuid.workspace = true
anyhow.workspace = true
rfd.workspace = true
notify.workspace = true
image.workspace = true
# 文件对话框必须放到后台线程，否则原生对话框会阻塞 Bevy 主循环。
crossbeam-channel = "0.5"
# 在系统文件管理器里定位资源用。
opener = "0.8"

[dev-dependencies]
tempfile = "3.13"
# 存档槽位浏览器测试要真实写入 `.sav` 文件（见 tests/存档槽位.rs）。
savegame.workspace = true
serde_json.workspace = true
# 布局持久化的测试需要直接构造/检查 `DockState`
# （例如验证"不含视口的布局会被拒绝"），
# 因此测试里需要直接使用 egui_dock。
egui_dock.workspace = true
# 中文/日文分段回归测试（tests/中文分段不告警.rs）直接调用 `bevy_text`
# 底层用到的同一个 parley 排版入口，复现"每次文本重排都会问 ICU4X 要
# 中日文分段模型"的调用路径。
#
# 这里**故意不启用** `complex-scripts`：该特性必须由 Bevy 的
# `complex_script_segmentation` 打开（见根 Cargo.toml 的 workspace.dependencies）。
# 如果哪天那个特性被删掉，这份测试就会立刻重新看到 ICU4X 警告并失败。
parley = { version = "0.11.1", default-features = false, features = ["std"] }
