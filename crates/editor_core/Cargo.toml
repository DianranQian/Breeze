[package]
name = "editor_core"
description = "Bevy Studio 编辑器核心：项目模型、编辑器状态、命令与事务、撤销重做栈。不依赖 Bevy 渲染层，可独立测试。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scene_doc.workspace = true
serde.workspace = true
# 原生 Cargo / Bevy 工程识别需要**只读地**解析用户的 `Cargo.toml`
# （工作区成员、[[bin]] 目标、bevy 依赖）。这个版本本来就在依赖图里，
# 不引入新的下载。见 `cargo_project` 模块头部说明。
toml = "1.1"
serde_json.workspace = true
ron.workspace = true
uuid.workspace = true
thiserror.workspace = true
anyhow.workspace = true
indexmap.workspace = true

[dev-dependencies]
tempfile = "3.13"
