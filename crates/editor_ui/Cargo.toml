[package]
name = "editor_ui"
description = "Bevy Studio 编辑器界面层：可停靠面板布局、场景树、Inspector、资源浏览器、控制台。基于 egui/egui_dock。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scene_doc.workspace = true
runtime_protocol.workspace = true
editor_core.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true
# 会话存档使用 JSON：带显式版本字段、损坏时容易人工检查，
# 且与 DSH 的事件格式一致（见 agent_store）。
serde_json.workspace = true
# 窗口布局的序列化格式与场景文件一致用 RON：
# 人可读、可手工修、进版本控制也不难读。
ron.workspace = true
# 字体加载错误的定义。
thiserror.workspace = true
# 图标 PNG 的运行时解码（图标本身以字节形式编进二进制，
# 见 `crates/editor_ui/src/icons.rs` 与 `tools/icon_bake`）。
image.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.13"
