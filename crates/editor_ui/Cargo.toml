[package]
name = "editor_ui"
description = "Bevy Studio 编辑器界面层：可停靠面板布局、场景树、Inspector、资源浏览器、控制台。基于 egui/egui_dock。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scene_doc.workspace = true
editor_core.workspace = true
egui.workspace = true
egui_dock.workspace = true
serde.workspace = true
# 窗口布局的序列化格式与场景文件一致用 RON：
# 人可读、可手工修、进版本控制也不难读。
ron.workspace = true
# 字体加载错误的定义。
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3.13"
